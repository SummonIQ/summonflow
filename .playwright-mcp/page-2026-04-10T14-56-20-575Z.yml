        - generic [ref=e35]: Features
        - heading "Everything you need for production realtime." [level=1] [ref=e36]
        - paragraph [ref=e37]: Channels, presence, encryption, webhooks, and a control plane that makes the whole system legible. Self-host it or let us run it.
      - generic [ref=e38]:
        - generic [ref=e39]:
          - img [ref=e41]
          - heading "Public, Private & Presence Channels" [level=3] [ref=e47]
          - paragraph [ref=e48]: Subscribe to public channels instantly. Use signed subscriptions for private data. Track who's online with presence channels and member rosters.
        - generic [ref=e49]:
          - img [ref=e51]
          - heading "End-to-end Encryption" [level=3] [ref=e54]
          - paragraph [ref=e55]: Private encrypted channels use AES-256-GCM with per-channel secrets. The server never sees plaintext — only clients with the key can decrypt.
        - generic [ref=e56]:
          - img [ref=e58]
          - heading "Presence & Member Tracking" [level=3] [ref=e63]
          - paragraph [ref=e64]: Know who's connected in real time. Get member_added and member_removed events with custom user info for collaborative UIs.
        - generic [ref=e65]:
          - img [ref=e67]
          - heading "Redis-backed Fanout" [level=3] [ref=e69]
          - paragraph [ref=e70]: Horizontally scale socket servers with Redis pub/sub. Every connected client gets the event regardless of which server they're on.
        - generic [ref=e71]:
          - img [ref=e73]
          - heading "Signed Subscription Auth" [level=3] [ref=e75]
          - paragraph [ref=e76]: Stateless auth flow — your backend signs subscription requests with your app secret. No sessions, no shared state, no race conditions.
        - generic [ref=e77]:
          - img [ref=e79]
          - heading "Deploy Anywhere" [level=3] [ref=e82]
          - paragraph [ref=e83]: Railway for persistent servers, Cloudflare Workers for edge routing, Vercel for auth and publish. Or use our managed platform and skip all of it.
        - generic [ref=e84]:
          - img [ref=e86]
          - heading "TypeScript Client SDK" [level=3] [ref=e90]
          - paragraph [ref=e91]: Clean API for subscribe, bind, trigger, and presence. Works in browser and Node.js. Reconnects with exponential backoff. Zero dependencies beyond WebSocket.
        - generic [ref=e92]:
          - img [ref=e94]
          - heading "Live Channel Monitor" [level=3] [ref=e96]
          - paragraph [ref=e97]: See active channels, subscriber counts, and connection state in real time from the console. No log spelunking.
        - generic [ref=e98]:
          - img [ref=e100]
          - heading "Channel Policies" [level=3] [ref=e104]
          - paragraph [ref=e105]: Define pattern-based rules per app — which channels are public, which require auth, which use encryption. Visible and auditable from the console.
        - generic [ref=e106]:
          - img [ref=e108]
          - heading "Webhooks" [level=3] [ref=e111]
          - paragraph [ref=e112]: Get notified when channels become occupied or vacated, members join or leave, and clients trigger events. Configure per application.
      - generic [ref=e114]:
