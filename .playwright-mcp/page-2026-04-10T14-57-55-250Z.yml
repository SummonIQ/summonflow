        - generic [ref=e41]:
          - generic [ref=e42]: Features
          - heading "Everything you need for production realtime." [level=1] [ref=e43]
          - paragraph [ref=e44]: Channels, presence, encryption, webhooks, and a control plane that makes the whole system legible. Self-host it or let us run it.
        - generic [ref=e45]:
          - generic [ref=e46]:
            - img [ref=e48]
            - heading "Public, Private & Presence Channels" [level=3] [ref=e54]
            - paragraph [ref=e55]: Subscribe to public channels instantly. Use signed subscriptions for private data. Track who's online with presence channels and member rosters.
          - generic [ref=e56]:
            - img [ref=e58]
            - heading "End-to-end Encryption" [level=3] [ref=e61]
            - paragraph [ref=e62]: Private encrypted channels use AES-256-GCM with per-channel secrets. The server never sees plaintext — only clients with the key can decrypt.
          - generic [ref=e63]:
            - img [ref=e65]
            - heading "Presence & Member Tracking" [level=3] [ref=e70]
            - paragraph [ref=e71]: Know who's connected in real time. Get member_added and member_removed events with custom user info for collaborative UIs.
          - generic [ref=e72]:
            - img [ref=e74]
            - heading "Redis-backed Fanout" [level=3] [ref=e76]
            - paragraph [ref=e77]: Horizontally scale socket servers with Redis pub/sub. Every connected client gets the event regardless of which server they're on.
          - generic [ref=e78]:
            - img [ref=e80]
            - heading "Signed Subscription Auth" [level=3] [ref=e82]
            - paragraph [ref=e83]: Stateless auth flow — your backend signs subscription requests with your app secret. No sessions, no shared state, no race conditions.
          - generic [ref=e84]:
            - img [ref=e86]
            - heading "Deploy Anywhere" [level=3] [ref=e89]
            - paragraph [ref=e90]: Railway for persistent servers, Cloudflare Workers for edge routing, Vercel for auth and publish. Or use our managed platform and skip all of it.
          - generic [ref=e91]:
            - img [ref=e93]
            - heading "TypeScript Client SDK" [level=3] [ref=e97]
            - paragraph [ref=e98]: Clean API for subscribe, bind, trigger, and presence. Works in browser and Node.js. Reconnects with exponential backoff. Zero dependencies beyond WebSocket.
          - generic [ref=e99]:
            - img [ref=e101]
            - heading "Live Channel Monitor" [level=3] [ref=e103]
            - paragraph [ref=e104]: See active channels, subscriber counts, and connection state in real time from the console. No log spelunking.
          - generic [ref=e105]:
            - img [ref=e107]
            - heading "Channel Policies" [level=3] [ref=e111]
            - paragraph [ref=e112]: Define pattern-based rules per app — which channels are public, which require auth, which use encryption. Visible and auditable from the console.
          - generic [ref=e113]:
            - img [ref=e115]
            - heading "Webhooks" [level=3] [ref=e118]
            - paragraph [ref=e119]: Get notified when channels become occupied or vacated, members join or leave, and clients trigger events. Configure per application.
